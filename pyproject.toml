[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joy-m2-ai-database"
version = "1.18.0"
description = "Engineering and verification tools for the Joy M2 question database"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
joy-m2 = "joy_m2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
